# nginx-Konfiguration für die Palworld-Webseite
#
# Installation:
#   sudo cp deploy/nginx-palworld-web.conf /etc/nginx/sites-available/palworld-web
#   sudo ln -s /etc/nginx/sites-available/palworld-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Danach HTTPS mit Let's Encrypt aktivieren – am einfachsten mit dem Skript,
# das server_name, www und die Auto-Erneuerung gleich mit erledigt:
#   sudo bash deploy/enable-https.sh
# Oder direkt certbot (passt diese Datei automatisch an):
#   sudo certbot --nginx -d palheim.de -d www.palheim.de

server {
    listen 80;
    listen [::]:80;

    # Domain anpassen!
    server_name palheim.de www.palheim.de;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip für schnellere Ladezeiten
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/plain;
}
