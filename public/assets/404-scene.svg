<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ein kleines Wesen steht ratlos vor einem Wegweiser">
  <defs>
    <linearGradient id="sky404" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf6fe"/>
    </linearGradient>
    <radialGradient id="sun404" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6df" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6df" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball404" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7ad"/>
      <stop offset="0.5" stop-color="#ffb454"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6fb"/>
    </linearGradient>
  </defs>

  <!-- Himmel -->
  <rect width="640" height="640" fill="url(#sky404)"/>
  <circle cx="500" cy="150" r="150" fill="url(#sun404)"/>

  <!-- Wolken -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <ellipse cx="150" cy="120" rx="70" ry="34"/>
      <ellipse cx="200" cy="108" rx="52" ry="30"/>
      <ellipse cx="110" cy="106" rx="42" ry="26"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="470" cy="80" rx="60" ry="28"/>
      <ellipse cx="512" cy="70" rx="44" ry="24"/>
    </g>
  </g>

  <!-- Ferne Hügel -->
  <path d="M0 430 Q 160 360 340 420 T 640 400 L640 640 L0 640 Z" fill="#bfe4a0"/>
  <path d="M0 470 Q 200 410 420 470 T 640 455 L640 640 L0 640 Z" fill="#8fd06b"/>

  <!-- Bäume -->
  <g>
    <rect x="70" y="430" width="14" height="46" rx="6" fill="#8a5a2b"/>
    <circle cx="77" cy="418" r="42" fill="#4bb257"/>
    <circle cx="52" cy="432" r="30" fill="#54c162"/>
    <circle cx="102" cy="432" r="30" fill="#43a44e"/>
  </g>
  <g>
    <rect x="566" y="440" width="12" height="42" rx="6" fill="#8a5a2b"/>
    <circle cx="572" cy="430" r="36" fill="#4bb257"/>
    <circle cx="596" cy="442" r="26" fill="#43a44e"/>
  </g>

  <!-- Nahe Wiese -->
  <path d="M0 520 Q 320 470 640 520 L640 640 L0 640 Z" fill="#5bb84c"/>
  <path d="M0 560 Q 320 520 640 560 L640 640 L0 640 Z" fill="#49a83f"/>

  <!-- Zaun links -->
  <g stroke="#a9723f" stroke-width="7" stroke-linecap="round">
    <line x1="20" y1="500" x2="20" y2="540"/>
    <line x1="70" y1="498" x2="70" y2="538"/>
    <line x1="6" y1="512" x2="84" y2="508"/>
    <line x1="6" y1="526" x2="84" y2="522"/>
  </g>

  <!-- Wegweiser mit Fragezeichen -->
  <g>
    <rect x="404" y="300" width="16" height="250" rx="6" fill="#9c6a38"/>
    <rect x="404" y="300" width="7" height="250" rx="3" fill="#b5824d"/>
    <!-- Schild -->
    <g transform="rotate(-4 412 270)">
      <rect x="352" y="232" width="120" height="86" rx="12" fill="#c48f52"/>
      <rect x="352" y="232" width="120" height="86" rx="12" fill="none" stroke="#8a5a2b" stroke-width="5"/>
      <text x="412" y="298" font-family="'Baloo 2','Segoe UI',sans-serif" font-size="70" font-weight="800" text-anchor="middle" fill="#5c3a17">?</text>
    </g>
    <!-- Richtungspfeile -->
    <g transform="rotate(-3 470 360)">
      <path d="M470 344 h64 l18 16 -18 16 h-64 z" fill="#c48f52" stroke="#8a5a2b" stroke-width="4"/>
    </g>
    <g transform="rotate(4 360 392)">
      <path d="M360 376 h-64 l-18 16 18 16 h64 z" fill="#b5824d" stroke="#8a5a2b" stroke-width="4"/>
    </g>
  </g>

  <!-- Fangball -->
  <g transform="translate(516 512)">
    <ellipse cx="0" cy="46" rx="34" ry="8" fill="#2f6d2a" opacity="0.25"/>
    <circle cx="0" cy="0" r="40" fill="url(#ball404)"/>
    <rect x="-40" y="-6" width="80" height="12" fill="#e9f2f8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#16405f" stroke-width="4" opacity="0.5"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="#16405f" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- Kleines ratloses Wesen -->
  <g transform="translate(232 470)">
    <!-- Schatten -->
    <ellipse cx="0" cy="86" rx="66" ry="14" fill="#2f6d2a" opacity="0.22"/>
    <!-- Flügel -->
    <path d="M-58 6 q -46 -18 -58 14 q 34 6 58 -2 z" fill="#54c162" stroke="#3fa447" stroke-width="3"/>
    <!-- Körper -->
    <path d="M-64 20 q -6 -84 64 -84 q 70 0 64 84 q 4 60 -64 60 q -68 0 -64 -60 z" fill="#fbf4e6" stroke="#e2d3b4" stroke-width="3"/>
    <!-- Ohren -->
    <path d="M-42 -60 q -14 -30 6 -40 q 14 20 8 44 z" fill="#fbf4e6" stroke="#e2d3b4" stroke-width="3"/>
    <path d="M42 -60 q 14 -30 -6 -40 q -14 20 -8 44 z" fill="#fbf4e6" stroke="#e2d3b4" stroke-width="3"/>
    <!-- Hochgehaltener Arm (kratzt sich am Kopf) -->
    <path d="M40 -34 q 40 -14 40 -52 q -2 -14 -16 -12 q 8 30 -34 40 z" fill="#fbf4e6" stroke="#e2d3b4" stroke-width="3"/>
    <!-- Augen -->
    <ellipse cx="-24" cy="-16" rx="15" ry="17" fill="#2f9de4"/>
    <ellipse cx="24" cy="-16" rx="15" ry="17" fill="#2f9de4"/>
    <circle cx="-24" cy="-16" r="7" fill="#12314e"/>
    <circle cx="24" cy="-16" r="7" fill="#12314e"/>
    <circle cx="-20" cy="-20" r="3" fill="#ffffff"/>
    <circle cx="28" cy="-20" r="3" fill="#ffffff"/>
    <!-- verwirrter Mund -->
    <path d="M-10 16 q 10 -8 20 2" fill="none" stroke="#12314e" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Füße -->
    <ellipse cx="-24" cy="74" rx="18" ry="12" fill="#f0e6cf" stroke="#e2d3b4" stroke-width="3"/>
    <ellipse cx="24" cy="74" rx="18" ry="12" fill="#f0e6cf" stroke="#e2d3b4" stroke-width="3"/>
  </g>
</svg>
